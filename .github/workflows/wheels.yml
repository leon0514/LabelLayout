name: Build and Publish

on:
  push:
    tags: ['v*']

jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels
        run: python -m pip install cibuildwheel && python -m cibuildwheel --output-dir wheelhouse
        env:
          # 使用 pip 作为构建前端，绕过 virtualenv 自动下载导致的 429
          CIBW_BUILD_FRONTEND: "pip"
          # 告诉 cibuildwheel 使用当前目录下的 pyproject.toml 进行构建
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"
          # 最关键：它会自动帮你处理 manylinux 标签，保证 PyPI 接受
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux2014"
          CIBW_BUILD_VERBOSITY: "1"
          
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true