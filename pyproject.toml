[build-system]
requires = ["scikit-build-core>=0.9.0", "pybind11>=2.13.0"]
build-backend = "scikit_build_core.build"

[project]
name = "labellayout"
version = "0.0.3" 
description = "Text Box layout."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Leon"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.scikit-build]
build.verbose = true
wheel.packages = ["labellayout"]

